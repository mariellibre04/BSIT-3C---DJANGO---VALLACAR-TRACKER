{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF5EB" />
  <title>Welcome - Vallacar Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            cream: '#FAF5EB',
            ceres: { red: '#C1121F', darkred: '#8f0e18', gold: '#F4A100', goldsoft: '#FFC53D' },
          },
        },
      },
    };
  </script>

  <style>
    :root { --card-shadow: 0 30px 70px -24px rgba(143, 14, 24, .28), 0 12px 30px -18px rgba(244, 161, 0, .35); }

    * { -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #FAF5EB;
      background-image:
        radial-gradient(900px 480px at 50% -8%, rgba(244, 161, 0, .18), transparent 62%),
        radial-gradient(760px 520px at 108% 112%, rgba(193, 18, 31, .12), transparent 60%),
        radial-gradient(620px 420px at -8% 108%, rgba(244, 161, 0, .12), transparent 60%),
        radial-gradient(rgba(143, 14, 24, .05) 1px, transparent 1px);
      background-size: auto, auto, auto, 22px 22px;
      background-position: center, center, center, 0 0;
    }

    .welcome-card {
      box-shadow: var(--card-shadow);
      animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both;
    }
    .welcome-card::before {
      content: "";
      position: absolute; inset: 0 0 auto 0; height: 6px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, #C1121F 0 55%, #F4A100 55% 100%);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .logo-glow { filter: drop-shadow(0 12px 22px rgba(244, 161, 0, .45)); animation: floaty 4.5s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .btn-gold {
      background: linear-gradient(180deg, #FFC53D 0%, #F4A100 100%);
      color: #6e2b00;
      box-shadow: 0 14px 30px -10px rgba(244, 161, 0, .95), 0 4px 12px -4px rgba(193, 18, 31, .35), inset 0 1px 0 rgba(255, 255, 255, .55);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn-gold:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 20px 38px -10px rgba(244, 161, 0, 1), 0 6px 16px -4px rgba(193, 18, 31, .4), inset 0 1px 0 rgba(255, 255, 255, .6); }
    .btn-gold:active { transform: translateY(0) scale(.99); }
    .btn-gold i { transition: transform .18s ease; }
    .btn-gold:hover i { transform: translateX(4px); }

    .fade-up { animation: fadeUp .8s ease both; }
    .delay-1 { animation-delay: .12s; }
    .delay-2 { animation-delay: .22s; }
    .delay-3 { animation-delay: .32s; }
    .delay-4 { animation-delay: .42s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .welcome-card, .logo-glow, .fade-up { animation: none !important; }
    }
  </style>
</head>

<body class="font-sans text-slate-800 min-h-screen flex flex-col items-center justify-center px-4 py-10 relative overflow-x-hidden">

  <main class="w-full max-w-md relative z-10">
    <section class="welcome-card relative bg-white rounded-[28px] px-7 py-10 sm:px-10 sm:py-12 text-center">

      <!-- Logo -->
      <div class="fade-up flex justify-center">
        <svg class="logo-glow w-24 h-24 sm:w-28 sm:h-28" viewBox="0 0 120 120" role="img" aria-label="Ceres Liner Vallacar Transit">
          <defs>
            <radialGradient id="goldStar" cx="50%" cy="32%" r="72%">
              <stop offset="0%" stop-color="#FFF0B8" />
              <stop offset="42%" stop-color="#FFC93C" />
              <stop offset="100%" stop-color="#D98200" />
            </radialGradient>
            <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#DC2531" />
              <stop offset="100%" stop-color="#9c0d18" />
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="56" fill="#ffffff" />
          <circle cx="60" cy="60" r="53" fill="none" stroke="url(#ring)" stroke-width="7" />
          <circle cx="60" cy="60" r="45.5" fill="none" stroke="#F4A100" stroke-width="2" opacity="0.55" />
          <polygon
            points="60,21 72,49.5 103,49.5 78,68 87.5,98 60,80 32.5,98 42,68 17,49.5 48,49.5"
            fill="url(#goldStar)" stroke="#b9710a" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- Brand -->
      <div class="fade-up delay-1 mt-5">
        <div class="text-[1.05rem] sm:text-lg font-extrabold tracking-[.06em] text-ceres-red">CERES LINER</div>
        <div class="text-[.68rem] font-bold tracking-[.28em] text-slate-400 mt-0.5">VALLACAR TRANSIT</div>
      </div>

      <!-- Title -->
      <h1 class="fade-up delay-2 mt-6 text-3xl sm:text-4xl font-extrabold tracking-[-.02em] text-ceres-darkred">
        Welcome, Passenger!
      </h1>

      <!-- Subtitle -->
      <p class="fade-up delay-3 mt-3 text-[.95rem] sm:text-base leading-relaxed text-slate-500">
        We&rsquo;re glad to have you on board.<br />
        Safe travels and smooth rides ahead.
      </p>

      <!-- CTA -->
      <a href="{% url 'dashboard' %}"
         class="fade-up delay-4 btn-gold mt-8 inline-flex w-full items-center justify-center gap-2 rounded-2xl px-6 py-3.5 text-base font-extrabold">
        Continue to Dashboard
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </a>

      <!-- Admin sign in -->
      <div class="fade-up delay-4 mt-6">
        <a href="{% url 'login' %}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-ceres-red transition-colors">
          <i class="fa-solid fa-user-shield"></i>
          Admin sign in
        </a>
      </div>
    </section>

    <p class="mt-6 text-center text-[.7rem] font-semibold tracking-[.16em] text-slate-400">
      VALLACAR TRANSIT INC. &bull; BUS TRACKING SYSTEM
    </p>
  </main>
</body>
</html>
